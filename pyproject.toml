[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nutq"
version = "0.1.0"
description = "Script conversion and text normalization (numbers, dates, money to words) for Tajik, Persian, Dari and Uzbek"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bahrom Sharifzoda" }]
requires-python = ">=3.9"
keywords = [
    "nlp", "tts", "text-normalization", "transliteration", "low-resource-languages",
    "tajik", "persian", "farsi", "dari", "uzbek", "cyrillic", "perso-arabic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Persian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.scripts]
nutq = "nutq.__main__:main"

[project.urls]
Homepage = "https://github.com/BAHROMTJ/nutq"
Issues = "https://github.com/BAHROMTJ/nutq/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nutq.lang.tg" = ["data/*.tsv"]
