[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nutq-mcp"
version = "0.1.0"
description = "MCP server for nutq: Tajik, Persian, Dari and Uzbek script conversion and text normalization for AI assistants"
readme = "README.md"
license = "MIT"
authors = [{ name = "Bahrom Sharifzoda" }]
requires-python = ">=3.10"
dependencies = ["nutq>=0.1.0", "mcp>=2.0,<3"]
keywords = ["mcp", "model-context-protocol", "tajik", "persian", "dari", "uzbek", "transliteration", "tts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
nutq-mcp = "nutq_mcp.server:main"

[project.urls]
Homepage = "https://github.com/BAHROMTJ/nutq/tree/main/mcp"
Issues = "https://github.com/BAHROMTJ/nutq/issues"

[tool.setuptools.packages.find]
where = ["src"]
